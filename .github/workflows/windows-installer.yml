name: Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_ID: ${{ github.event.release.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Check release version and assets
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $name = "screenshot-redactor-setup-$version-windows-x64.exe"
          $portable = "screenshot-redactor-portable-$version-windows-x64.zip"
          "name=$name" >> $env:GITHUB_OUTPUT
          "portable=$portable" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            'present=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $releaseVersion = if ($env:RELEASE_TAG -match '^v\d+\.\d+$') { "$env:RELEASE_TAG.0" } else { $env:RELEASE_TAG }
          if ($releaseVersion -ne "v$version") { throw 'Release tag must match package.json' }
          $existing = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets" --jq '.[] | select(.state == "uploaded" and .size > 0) | .name'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $present = ($existing -contains $name -and $existing -contains "$name.sig" -and $existing -contains $portable -and $existing -contains "$portable.sig").ToString().ToLowerInvariant()
          "present=$present" >> $env:GITHUB_OUTPUT
      - if: steps.asset.outputs.present == 'false'
        run: npm ci
      - if: steps.asset.outputs.present == 'false'
        run: npm test
      - if: steps.asset.outputs.present == 'false'
        run: npm run package:win
      - name: Ensure WebView2 is available for the desktop test
        if: steps.asset.outputs.present == 'false'
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $paths = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client", "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$client")
          $installed = foreach ($path in $paths) {
            Get-ItemPropertyValue -LiteralPath $path -Name pv -ErrorAction SilentlyContinue
          }
          if ($installed | Where-Object { $_ -and [version]$_ -gt [version]'0.0.0.0' }) { exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid WebView2 installer signature' }
          $process = Start-Process -FilePath $setup -ArgumentList '/silent /install' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode) { exit $process.ExitCode }
      - if: steps.asset.outputs.present == 'false'
        shell: pwsh
        run: |
          $env:REDACTOR_PACKAGE_UNDER_TEST = 'release/lightweight'
          node --test tests/installer.test.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:desktop
      - name: Sign Windows packages with RSA-2048
        if: steps.asset.outputs.present == 'false'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          INSTALLER_NAME: ${{ steps.asset.outputs.name }}
          PORTABLE_NAME: ${{ steps.asset.outputs.portable }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) {
            throw 'UPDATE_SIGNING_KEY secret is required to generate RSA-2048 .sig files.'
          }
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $key = $env:UPDATE_SIGNING_KEY.Trim()
            if ($key.StartsWith('<')) {
              $rsa.FromXmlString($key)
            } else {
              $rsa.ImportFromPem($key)
            }
            if ($rsa.KeySize -ne 2048) { throw "Expected RSA-2048 signing key, got $($rsa.KeySize)-bit." }
            $updateReleaseSource = Get-Content -Raw 'desktop/UpdateRelease.cs'
            if ($updateReleaseSource -notmatch 'PublicKeyXml\s*=\s*"([^"]+)"') {
              throw 'Could not locate UpdateRelease.PublicKeyXml in desktop/UpdateRelease.cs'
            }
            $verifier = [System.Security.Cryptography.RSA]::Create()
            $verifier.FromXmlString($Matches[1].Replace('\"', '"'))
            try {
              foreach ($name in @($env:INSTALLER_NAME, $env:PORTABLE_NAME)) {
                $path = "release/lightweight/$name"
                $stream = [System.IO.File]::OpenRead($path)
                try {
                  $signature = $rsa.SignData($stream, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
                } finally {
                  $stream.Dispose()
                }
                $verifyStream = [System.IO.File]::OpenRead($path)
                try {
                  if (-not $verifier.VerifyData($verifyStream, $signature, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)) {
                    throw "Generated signature for $name does not match UpdateRelease.PublicKeyXml"
                  }
                } finally {
                  $verifyStream.Dispose()
                }
                [System.IO.File]::WriteAllText("$path.sig", [Convert]::ToBase64String($signature), [System.Text.Encoding]::ASCII)
              }
            } finally {
              $verifier.Dispose()
            }
          } finally {
            $rsa.Dispose()
          }
      - name: Stage signed Windows packages for an existing release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-windows-packages
          if-no-files-found: error
          retention-days: 3
          path: |
            release/lightweight/${{ steps.asset.outputs.name }}
            release/lightweight/${{ steps.asset.outputs.name }}.sig
            release/lightweight/${{ steps.asset.outputs.portable }}
            release/lightweight/${{ steps.asset.outputs.portable }}.sig
      - name: Attach Windows downloads
        if: github.event_name == 'release' && steps.asset.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_NAME: ${{ steps.asset.outputs.name }}
          PORTABLE_NAME: ${{ steps.asset.outputs.portable }}
        shell: pwsh
        run: |
          $incomplete = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets" --jq '.[] | select(.state == "starter") | .name'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $existing = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID/assets" --jq '.[] | select(.state == "uploaded" and .size > 0) | .name'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($name in @($env:INSTALLER_NAME, "$($env:INSTALLER_NAME).sig", $env:PORTABLE_NAME, "$($env:PORTABLE_NAME).sig")) {
            if ($existing -contains $name) { continue }
            if ($incomplete -contains $name) {
              gh release delete-asset $env:RELEASE_TAG $name --yes
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            gh release upload $env:RELEASE_TAG "release/lightweight/$name"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
